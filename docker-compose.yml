services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
      POSTGRES_DB: jobs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  web:
    build: .
    command: ["web"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://jobs:jobs@db:5432/jobs
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: .
    command: ["worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://jobs:jobs@db:5432/jobs
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
