# =============================================================================
# Skills taxonomy — the reviewable dictionary behind the "skills map".
#
# app/normalise/skills.py scans each listing's text (title + excerpt now; richer
# requirements text later if a detail-fetch pass is added) for these terms and
# tags the listing with the CANONICAL skill name. Only the tags are stored, never
# the source text (keeps us within CRAWLING.md conduct + copyright).
#
# Structure:
#   <Category>:
#     <Canonical skill>: [alias, alias, ...]   # aliases matched case-insensitively,
#                                              # whole-word/phrase. Canonical name is
#                                              # always matched too.
# Extend freely — this is data, not code.
# =============================================================================

Research & analysis:
  Research methods: ["research methods", "research design", "experimental design"]
  Data analysis: ["data analysis", "data analytics", "analysing data"]
  Statistics: ["statistics", "statistical analysis", "biostatistics", "statistical"]
  Qualitative research: ["qualitative", "qualitative research"]
  Quantitative research: ["quantitative", "quantitative research"]
  Grant writing: ["grant writing", "grants", "grant applications", "funding applications"]
  Publications: ["publications", "peer-reviewed", "publishing", "journal articles"]
  Literature review: ["literature review", "systematic review"]

