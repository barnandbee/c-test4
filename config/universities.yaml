# =============================================================================
# University source configuration — the heart of the "config not code" design.
#
# Adding a university = adding a record here. No new Python required unless the
# platform family isn't yet supported by an adapter.
#
# IMPORTANT — endpoint confidence:
#   This config was compiled from public web search + known Australian HE ATS
#   URL patterns. The build environment has NO outbound network access to these
#   domains, so endpoints are RESEARCHED, NOT LIVE-VERIFIED. `confidence` reflects
#   that. On first deployment run `python -m app.ingest.runner --verify` to
#   confirm each endpoint and adjust params. See DISCOVERY.md.
#
# Fields:
#   slug            stable identifier (used in URLs + the id hash)
#   name            canonical employer name
#   state           ACT NSW NT QLD SA TAS VIC WA
#   groups          any of: go8, atn, iru, run  (drives the UI presets)
#   adapter         which platform adapter handles this uni
#   careers_url     human-facing careers landing page (shown in admin)
#   params          adapter-specific connection parameters
#   confidence      high | medium | low  (of the platform+endpoint identification)
#   notes           anything a maintainer fixing this adapter should know
#
# Adapter param contracts:
#   pageup:         listing_url (required), feed_url (optional RSS/JSON)
#   workday:        tenant, dc (data-center host, e.g. wd3/wd5/wd105), site
#   nganet:         base_url, board_id
#   smartrecruiters: company_id
#   html_generic:   listing_url, row_selector, title_selector, link_selector,
#                   location_selector, date_selector  (CSS selectors)
# =============================================================================

universities:
  # ------------------------------- ACT -------------------------------
  - slug: anu
    name: Australian National University
    state: ACT
    groups: [go8]
    adapter: pageup
    careers_url: https://jobs.anu.edu.au/
    params:
      listing_url: https://jobs.anu.edu.au/cw/en/listing/
      feed_url: https://jobs.anu.edu.au/cw/en/listing/?rss=1
    confidence: high
    notes: Classic PageUp vanity domain. RSS commonly available on PageUp cw sites.

