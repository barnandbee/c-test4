<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Australian University Jobs Board{% endblock %}</title>
  <meta name="description" content="Every open vacancy across the 42 Australian universities, in one searchable board.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="alternate" type="application/rss+xml" title="Jobs feed" href="/rss">
</head>
<body>
  <a class="skip-link" href="#results">Skip to results</a>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/" aria-label="AU Uni Jobs — home">
        <img class="brand-logo" src="/static/logo.png" alt="AU Uni Jobs" width="150"
             onerror="this.remove();var f=document.getElementById('brand-fallback');if(f)f.hidden=false;">
        <span class="brand-text" id="brand-fallback" hidden>
          <span class="brand-mark" aria-hidden="true">◍</span>
          <span class="brand-name">AU<span class="brand-sep">/</span>UNI JOBS</span>
        </span>
      </a>
      <p class="brand-tag">Open vacancies across all 42 Australian universities</p>
      <nav class="site-nav">
        {% if is_admin %}
          <a href="/admin">Source health</a>
          <a href="/admin/analytics">Analytics</a>
          <a href="/admin/featured">Featured</a>
          <a href="/admin/api-docs">API</a>
          <a href="/admin/logout" class="nav-logout">Log out</a>
        {% else %}
          <a href="/admin/login">Admin</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
